<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#1a1208" />
    <meta name="description" content="HashBee - Earn Honey, Grow Your Swarm, Cash Out Rewards" />
    <title>HashBee 🐝</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preconnect to ad CDNs so DNS/TLS is resolved before we need them -->
    <link rel="preconnect" href="https://cdn.tgads.space" crossorigin />
    <link rel="preconnect" href="https://ad.gigapub.tech" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Telegram WebApp SDK (must be synchronous per Telegram docs) -->
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>

    <!-- AdExium CSS: loaded async via JS to avoid render blocking -->
    <script>
      (function() {
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://cdn.tgads.space/assets/css/style.min.css?ver=1.81';
        document.head.appendChild(link);
      })();
    </script>

    <!--
      AdExium Widget Script: async so it does NOT block page render.
      We pre-warm the widget instance the moment the script loads (onload).
    -->
    <script>
      // AdExium Safe Initializer — callable anytime (idempotent)
      window.initAdexium = function() {
        if (window.adexiumWidget) return window.adexiumWidget;
        try {
          var WidgetClass = window.AdexiumWidget || window.TGAdsWidget;
          if (WidgetClass) {
            var isInsideTg = !!(window.Telegram && window.Telegram.WebApp &&
              (window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user && window.Telegram.WebApp.initDataUnsafe.user.id
               || window.Telegram.WebApp.initData));
            var adex = new WidgetClass({
              wid: '8e21d2a6-6c80-4b16-baf9-990e07ff2f00',
              adFormat: 'interstitial',
              debug: !isInsideTg
            });
            window.adexiumWidget = adex;
            window._adexiumReady = true;
            console.log('[AdExium] ✅ Widget initialized. WID: 8e21d2a6-6c80-4b16-baf9-990e07ff2f00');
            return adex;
          }
        } catch(e) {
          console.error('[AdExium] Initialization error:', e);
        }
        return null;
      };

      // Load AdExium script async — call initAdexium() immediately when it's done
      var adexScript = document.createElement('script');
      adexScript.src = 'https://cdn.tgads.space/assets/js/adexium-widget.min.js';
      adexScript.async = true;
      adexScript.id = 'adexium-script';
      adexScript.onload = function() {
        // Pre-warm immediately so first ad request needs 0 cold-start time
        window.initAdexium();
      };
      adexScript.onerror = function() {
        console.warn('[AdExium] Script failed to load.');
      };
      document.head.appendChild(adexScript);

      // Load GigaPub script async — suppress background auto-loop so GigaPub
      // only shows on programmatic single invocation from our waterfall
      var gigaScript = document.createElement('script');
      // Set the loop-suppression flag BEFORE the script executes
      window.__giga_inter_running__ = true;
      gigaScript.src = 'https://ad.gigapub.tech/script?id=8543';
      gigaScript.async = true;
      gigaScript.onload = function() {
        console.log('[GigaPub] ✅ Script loaded. App ID: 8543');
      };
      document.head.appendChild(gigaScript);
    </script>

    <script>
      // Initialize Telegram WebApp SDK safely
      document.addEventListener('DOMContentLoaded', function() {
        try {
          if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
          }
        } catch(e) {}
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
