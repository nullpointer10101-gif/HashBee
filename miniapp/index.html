<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#1a1208" />
    <meta name="description" content="HashBee - Earn Honey, Grow Your Swarm, Cash Out Rewards" />
    <title>HashBee 🐝</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.tgads.space" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>

    <!-- Monetag Telegram Mini App SDK (Zone 11894371) -->
    <script src="https://libtl.com/sdk.js" data-zone="11894371" data-sdk="show_11894371"></script>
    <script>
      (function() {
        var attempts = 0;
        function setupMonetag() {
          attempts++;
          if (typeof window.show_11894371 === 'function') {
            console.log('[Monetag] show_11894371 is ready!');
            
            // 1. In-App settings
            try {
              window.show_11894371({
                type: 'inApp',
                inAppSettings: {
                  frequency: 2,
                  capping: 0.1,
                  interval: 120,
                  timeout: 3,
                  everyPage: false
                }
              });
            } catch(e) {
              console.warn('[Monetag] inApp init error:', e);
            }

            // 2. Trigger on-open ad after 2 seconds
            setTimeout(function() {
              try {
                console.log('[Monetag] Launching on-open ad...');
                window.show_11894371().then(function() {
                  console.log('[Monetag] Ad viewed successfully');
                }).catch(function(err) {
                  console.warn('[Monetag] Interstitial error, trying pop format:', err);
                  try {
                    window.show_11894371('pop').catch(function(e) {
                      console.warn('[Monetag] pop format error:', e);
                    });
                  } catch(e) {}
                });
              } catch(e) {
                console.error('[Monetag] Ad trigger exception:', e);
              }
            }, 2000);

            // 3. Trigger recurring ad every 2 minutes (120 seconds)
            setInterval(function() {
              try {
                console.log('[Monetag] Launching 2-minute interval ad...');
                window.show_11894371().catch(function() {});
              } catch(e) {}
            }, 120000);

          } else if (attempts < 20) {
            setTimeout(setupMonetag, 600);
          } else {
            console.warn('[Monetag] SDK failed to load after 20 attempts. Check ad-blocker or zone status.');
          }
        }
        
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', setupMonetag);
        } else {
          setupMonetag();
        }
      })();
    </script>

    <!-- AdExium Official Monetization Script (HashBee TMA Only) -->
    <script type="text/javascript" src="https://cdn.tgads.space/assets/js/adexium-widget.min.js"></script>
    <script type="text/javascript">
      document.addEventListener('DOMContentLoaded', function() {
        try {
          if (window.Telegram?.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
          }
        } catch(e) {}

        try {
          const WidgetClass = window.AdexiumWidget || window.TGAdsWidget;
          if (WidgetClass) {
            const adexiumWidget = new WidgetClass({
              wid: '8e21d2a6-6c80-4b16-baf9-990e07ff2f00',
              adFormat: 'interstitial'
            });
            adexiumWidget.autoMode();
            window.adexiumWidget = adexiumWidget;
            console.log('[AdExium] Initialized autoMode with HashBee WID: 8e21d2a6-6c80-4b16-baf9-990e07ff2f00');

            adexiumWidget.on('adReceived', function(ad) {
              console.log('[AdExium] Ad received, displaying...');
              try {
                if (typeof adexiumWidget.displayAd === 'function') {
                  adexiumWidget.displayAd(ad);
                }
              } catch(err) {
                console.error('[AdExium] displayAd error:', err);
              }
            });

            adexiumWidget.on('adClosed', function() {
              console.log('[AdExium] Ad closed');
            });

            adexiumWidget.on('noAdFound', function() {
              console.warn('[AdExium] noAdFound for HashBee placement');
            });

            adexiumWidget.on('requestAdError', function(e) {
              console.warn('[AdExium] requestAdError:', e);
            });

            // Trigger open ad after brief render delay
            setTimeout(function() {
              try {
                console.log('[AdExium] Requesting initial interstitial ad for HashBee...');
                adexiumWidget.requestAd('interstitial');
              } catch(e) {
                console.warn('[AdExium] requestAd error:', e);
              }
            }, 800);
          }
        } catch(e) {
          console.error('[AdExium] Initialization error:', e);
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
